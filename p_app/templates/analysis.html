<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CyberShield NID</title>

  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      background-color: #0a0f1f;
      color: #00eaff;
      font-family: 'Orbitron', sans-serif;
    }

    .hero {
      text-align: center;
      padding: 100px 20px;
      background: linear-gradient(180deg, #0a0f1f, #001a33);
      box-shadow: 0 0 40px #00eaff;
    }

    .hero h1 {
      font-size: 3.5rem;
      text-shadow: 0 0 25px #00eaff;
    }

    .hero p {
      font-size: 1.3rem;
      color: #00ff88;
    }

    .btn-cyber {
      background-color: #00eaff;
      color: #0a0f1f;
      font-weight: bold;
      box-shadow: 0 0 20px #00eaff;
    }

    .chart-section {
      margin: 60px auto;
      width: 85%;
      background: rgba(0,0,0,0.5);
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 0 25px #00eaff;
    }

    h2 {
      text-align: center;
      text-shadow: 0 0 15px #00eaff;
      margin-bottom: 30px;
    }

    footer {
      text-align: center;
      padding: 20px;
      margin-top: 40px;
      border-top: 1px solid #00eaff;
      color: #00ff88;
    }
  </style>
</head>
<body>

  <!-- Hero Section -->
  <div class="hero">
    <h1>CyberShield NID</h1>
    <p>Katsina State Polytechnic 2026</p>
    <a href="/upload" class="btn btn-cyber btn-lg mt-4">Start Analysis</a>
  </div>

  <!-- Traffic Classification Chart -->
  <!-- <div class="chart-section">
    <h2>Traffic Classification Overview</h2>
    <canvas id="trafficChart" height="120"></canvas>
  </div> -->

  <!-- Protocol Distribution Chart -->
  <div class="chart-section">
    <h2>Protocol Distribution</h2>
    <canvas id="protocolChart" height="120"></canvas>
  </div>

  <!-- Attack Trends Chart -->
  <div class="chart-section">
    <h2>Attack Trends Over Time</h2>
    <canvas id="attackChart" height="120"></canvas>
  </div>

  <!-- Footer -->
  <footer>
    <p>© 2026 CyberShield NID | Securing Networks with AI</p>
  </footer>

  <!-- Chart.js Scripts -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      // Traffic Chart
      new Chart(document.getElementById('trafficChart'), {
        type: 'doughnut',
        data: {
          labels: ['Normal Traffic', 'Attack Traffic'],
          datasets: [{
            data: [65, 35], // Replace with dynamic values
            backgroundColor: ['rgba(0,255,136,0.7)', 'rgba(255,0,76,0.7)'],
            borderColor: ['rgba(0,255,136,1)', 'rgba(255,0,76,1)'],
            borderWidth: 3
          }]
        },
        options: {
          plugins: { legend: { labels: { color: '#00eaff' } } }
        }
      });

      // Protocol Chart
      new Chart(document.getElementById('protocolChart'), {
        type: 'bar',
        data: {
          labels: ['TCP', 'UDP', 'ICMP'],
          datasets: [{
            label: 'Connections',
            data: [50, 20, 10], // Replace with dynamic values
            backgroundColor: ['rgba(0,255,136,0.7)', 'rgba(0,234,255,0.7)', 'rgba(255,0,76,0.7)'],
            borderColor: ['rgba(0,255,136,1)', 'rgba(0,234,255,1)', 'rgba(255,0,76,1)'],
            borderWidth: 2
          }]
        },
        options: {
          scales: {
            x: { ticks: { color: '#00eaff' } },
            y: { ticks: { color: '#00eaff' } }
          }
        }
      });

      // Attack Trends Chart
      new Chart(document.getElementById('attackChart'), {
        type: 'line',
        data: {
          labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May'],
          datasets: [{
            label: 'Detected Attacks',
            data: [5, 12, 8, 15, 20], // Replace with dynamic values
            borderColor: 'rgba(255,0,76,1)',
            backgroundColor: 'rgba(255,0,76,0.3)',
            tension: 0.3,
            fill: true
          }]
        },
        options: {
          scales: {
            x: { ticks: { color: '#00eaff' } },
            y: { ticks: { color: '#00eaff' } }
          },
          plugins: { legend: { labels: { color: '#00eaff' } } }
        }
      });
    });
  </script>

</body>
</html>
