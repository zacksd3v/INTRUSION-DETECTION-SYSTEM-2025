{% load static %}
{% load sweetify %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload CSV Here</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'result.css' %}">
    <link rel="icon" type="image/x-icon" href="../static/new.jpg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        body {
        background-color: #0a0f1f;
        color: #00eaff;
        font-family: 'Orbitron', sans-serif;
    }

    .upload-box {
        margin: 80px auto;
        padding: 40px;
        width: 50%;
        background: rgba(0, 0, 0, 0.4);
        border: 2px solid #00eaff;
        border-radius: 15px;
        box-shadow: 0 0 20px #00eaff;
        text-align: center;
    }

    .btn-cyber {
        background-color: #00eaff;
        color: #000;
        font-weight: bold;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px #00eaff;
    }
        form {
            padding: 20px;
        }

        input[type="file"] {
            margin-bottom: 10px;
            transform: scale(1.05); 
            background-color: #15756d;
            transition: transform 0.2s ease;
        }

        .m {
            margin-right: 104rem;
        }

        img {
            height: 10rem;
        }
    </style>

</head>
<body>
       <!-- Page Loader -->
<div id="loader-wrapper" style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: #0a0f1f;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
">
    <div class="spinner-border text-info" role="status" style="width: 5rem; height: 5rem; filter: drop-shadow(0 0 20px #00eaff);">
    </div>
</div>  
{% sweetify %}
<!-- Image and text -->
<nav class="navbar navbar-light bg-blue" style="border-bottom: 1px solid; box-shadow: 0px 4px 8px 0px rgba(12, 147, 226, 0.3); margin-bottom: 40px; height: 20%;">

    <img src="../static/new.jpg" class="d-inline-block align-top" alt="">
    <h1 class="m">INTRUSION DETECTION SYSTEM 2025</h1>

</nav>

<div class="upload-box">
    <h2>Upload Traffic File</h2>
    <p>Upload a network traffic file to classify it as NORMAL or ATTACK.</p>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-cyber mt-3">Analyze Traffic</button>
    </form>
</div>
<div class="text-center">
        <a href="{% url 'dashboard' %}" class="btn btn-info btn-back">⬅ Back to Dashboard</a>
</div>

<script>
    window.addEventListener("load", function() {
        const loader = document.getElementById("loader-wrapper");
        loader.style.opacity = "0";
        loader.style.transition = "opacity 0.5s ease";

        setTimeout(() => {
            loader.style.display = "none";
        }, 500);
    });
</script>

</body>
</html>
